bot:
  name: "ربات انجمن هوش مصنوعی"
  session_name: "aiabot"

database:
  path: "data/aiabot.db"

media:
  upload_path: "data/media"
  max_file_size_mb: 50

payment:
  enabled: true
  # Replace with your actual card number before deployment
  card_number: "0000-0000-0000-0000"
  card_holder: "انجمن علمی هوش مصنوعی"

web:
  host: "0.0.0.0"
  port: 8080

registration:
  fsm_timeout_minutes: 30

notifications:
  reminder_hours_before: 24
  check_interval_seconds: 3600

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_bytes: 10485760
  backup_count: 5
