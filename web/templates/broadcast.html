{% extends "base.html" %}
{% block title %}برادکست - پنل مدیریت{% endblock %}
{% block content %}
<h1>📢 ارسال پیام گروهی</h1>

<form method="POST" class="broadcast-form">
    <div class="form-group">
        <label>متن پیام *</label>
        <textarea name="message_text" rows="6" placeholder="متن پیام را اینجا وارد کنید..." required></textarea>
    </div>

    <div class="form-group">
        <label>ارسال به</label>
        <select name="target">
            <option value="all">همه کاربران</option>
            <option value="approved">کاربران تأیید شده</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">📤 ارسال</button>
    </div>
</form>
{% endblock %}
