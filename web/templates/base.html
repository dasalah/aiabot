<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل مدیریت انجمن هوش مصنوعی{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🤖 پنل مدیریت انجمن هوش مصنوعی</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard.index') }}">📊 داشبورد</a>
            <a href="{{ url_for('events.list_events') }}">📅 رویدادها</a>
            <a href="{{ url_for('registrations.list_registrations') }}">📝 ثبت‌نام‌ها</a>
            <a href="{{ url_for('broadcast.broadcast') }}">📢 برادکست</a>
            <a href="{{ url_for('logout') }}">🚪 خروج</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
